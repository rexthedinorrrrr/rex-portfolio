color:#4e5cde}.panel{overflow:hidden}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:20px;border-bottom:1px solid var(--line)}input[type=search],select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;color:var(--ink);min-height:44px}input[type=search]{flex:1;min-width:175px}select{max-width:180px}.btn{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:12px;font-weight:750;color:#46536d}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.soft{background:var(--blue2);color:#4551c9;border-color:transparent}.btn:disabled{opacity:.42;cursor:default}.subbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);font-size:13px;color:#77839a}.toggle{display:flex;align-items:center;gap:7px;cursor:pointer}.toggle input{accent-color:var(--blue)}.content{padding:26px 30px 30px}.q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}.pill{display:inline-flex;padding:7px 11px;background:#f1f3f8;border-radius:100px;color:#6b7890;font-size:12px;font-weight:700}.num{color:var(--blue);font-weight:850;font-size:13px}.question{font-size:clamp(18px,2.2vw,23px);line-height:1.65;font-weight:760;white-space:pre-line;letter-spacing:-.01em;margin:0 0 22px}.opts{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;padding:14px 15px;border:1.5px solid var(--line);background:#fff;border-radius:14px;color:#344158;line-height:1.55;transition:.14s}.option:hover:not(:disabled){border-color:#9fa9ef;background:#fafaff}.option.selected{border-color:var(--blue);background:#f1f2ff}.option.correct{border-color:#52bb92;background:#eefaf4}.option.wrong{border-color:#e28c91;background:#fff0f0}.mark{width:27px;height:27px;display:grid;place-items:center;border:1px solid #cdd4e3;border-radius:9px;flex:0 0 27px;font-size:12px;font-weight:800;color:#68758b}.selected .mark{background:var(--blue);border-color:var(--blue);color:white}.correct .mark{background:var(--green);border-color:var(--green);color:white}.wrong .mark{background:var(--red);border-color:var(--red);color:white}textarea{resize:vertical;min-height:140px;border:1.5px solid var(--line);border-radius:14px;width:100%;padding:15px;outline:none;line-height:1.7;color:var(--ink)}textarea:focus{border-color:var(--blue)}.answer{background:#f5f7ff;border:1px solid #e2e6ff;border-radius:14px;padding:18px;margin:20px 0;line-height:1.8;white-space:pre-line}.answer strong{color:#4251cc}.answer .warn{color:#a36b11}.feedback{font-size:13px;font-weight:800;margin:14px 0 0}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:23px}.actions .push{margin-left:auto}.empty{padding:65px 25px;text-align:center;color:var(--muted)}.empty h2{color:var(--ink)}.foot{color:#8692a5;font-size:12px;line-height:1.7;margin-top:20px}.summary-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.summary-box{padding:18px;border-radius:16px;background:#f4f6fb;text-align:center}.summary-box b{font-size:26px;display:block}.navigator{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:9px;margin:18px 0}.navigator button{height:42px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:750;color:#748098}.navigator button.done{background:#dff6ec;border-color:#9bd9bc;color:#157d5d}.navigator button.missed{background:#fff0f0;border-color:#e8b8ba;color:#be444d}.navigator button.current{box-shadow:0 0 0 2px #6773e8}.modeTabs{display:flex;gap:8px;flex-wrap:wrap}.modeTabs button{border:1px solid var(--line);padding:10px 14px;border-radius:10px;background:white;color:#65718a;font-weight:750}.modeTabs button.active{background:#eceeff;border-color:#c3c8fc;color:#4652c8}@media(max-width:850px){.workspace{grid-template-columns: <script>
const questions=[{"id": 1, "section": "Display Technology", "type": "short", "question": "Make a comparison of LCD & OLED display (Driving)", "options": [], "answer": "LCD: Voltage driving\nOLED: Current driving", "note": null}, {"id": 2, "section": "Display Technology", "type": "short", "question": "Illustrate three methods of OLED color patterning", "options": [], "answer": "RGB by FMM/evaporation or IJP\nCF+WOLED\nColor conversion", "note": null}, {"id": 3, "section": "Display Technology", "type": "short", "question": "What is QD? and describe its applications in display", "options": [], "answer": "A light-emitting semiconductor crystallite nanostructure, particle size is small enough to exhibit quantum mechanical properties in nanometer range, the emitting wavelength is dependent on particle size.\nQD for LCD backlight (QDEF), QD-CF for LCD, QD-OLED for color conversion emission, QD-LED.", "note": null}, {"id": 4, "section": "Display Technology", "type": "short", "question": "Explain what challenges in developing microLED display", "options": [], "answer": "LED technology, massive transfer, backplane, Inspection & repair, light extraction, supplier chain, ...", "note": null}, {"id": 5, "section": "Display Technology", "type": "short", "question": "What’s ppi? What’s UHD resolution? For 65” UHD TV, what’s its resolution in ppi?", "options": [], "answer": "ppi = pixel per inch\nUHD: 3840×2160\n65” UHD TV is 67.78 ppi (68 ppi)\n(65” dimension = 56.65” × 31.87”)", "note": null}, {"id": 6, "section": "Semiconductor Process / FinFET", "type": "short", "question": "Name at least one application each for high-k and low-k materials used in semiconductor process?", "options": [], "answer": "High-k material: Gate dielectrics, Etch Stop Layer, MIM Capacitors, Inductors,......\nLow-k material: FEOL gate spacers, BEOL Inter-Metal Dielectrics.....", "note": null}, {"id": 7, "section": "Semiconductor Process / FinFET", "type": "short", "question": "What are the conducting metals used in Apple M4 chip from contact level and above?", "options": [], "answer": "Co, W, Cu (including Co cap and Mn doped), Al", "note": null}, {"id": 8, "section": "Semiconductor Process / FinFET", "type": "short", "question": "Do you think tsmc adopted ALD technology in their N3 process as seen in Apple chip? If yes, what are those layers? Identify at least two.", "options": [], "answer": "Yes. High-k gate dielectrics, Work function Metals (WFM), Gate spacers, SAQP/SADP patterning spacer,.......", "note": null}, {"id": 9, "section": "Semiconductor Process / FinFET", "type": "short", "question": "What are the fin (channel) materials adopted for PMOS and NMOS in Apple M4 chip, respectively?", "options": [], "answer": "Epi Si for NMOS and Epi SiGe for PMOS", "note": null}, {"id": 10, "section": "Epitaxy & RTP", "type": "short", "question": "Please describe what is Epitaxy?", "options": [], "answer": "Growing a monocrystalline film which takes on a lattice structure and orientation identical to the substrate.", "note": null}, {"id": 11, "section": "Epitaxy & RTP", "type": "short", "question": "Please list at least 3 silicon precursors and 3 dopant gases for typical silicon epitaxy process?", "options": [], "answer": "Silicon precursors: DCS, TCS, SiH4 (silane), Si2H6 (disilane)\nDopant gases: B2H6, PH3, AsH3", "note": null}, {"id": 12, "section": "Epitaxy & RTP", "type": "short", "question": "What are the two major purposes of RTP implant anneal processes?", "options": [], "answer": "Post implant Dopant Activation and Defect Recovery", "note": null}, {"id": 13, "section": "Epitaxy & RTP", "type": "short", "question": "Please arrange the process sequence of the following Gate dielectric stacking chambers? DPN, PNA, RadOx (base oxide)", "options": [], "answer": "RadOx (base oxide) → DPN → PNA", "note": null}, {"id": 14, "section": "Epitaxy & RTP", "type": "short", "question": "Please name 3 applications for RTP chamber.", "options": [], "answer": "Well anneal, LDD anneal, S/D anneal, gate oxidation, gate nitridation, STI liner formation, salicide anneal.", "note": null}, {"id": 15, "section": "Epitaxy & RTP", "type": "short", "question": "Please list 3 reasons of gate oxide nitridation.", "options": [], "answer": "Reduce boron penetration, Small increase in the effective dielectric constant-k, EOT reduction for the same device performance, increase reliability of oxides.", "note": null}, {"id": 16, "section": "Epitaxy & RTP", "type": "short", "question": "What’s the key process module after S/D formation for contact?", "options": [], "answer": "(CoSi or NiSi or TiSi) Salicide process", "note": null}, {"id": 17, "section": "Epitaxy & RTP", "type": "short", "question": "Please arrange the required thermal budget from large to small? WELL anneal, LDD anneal, Source/Drain anneal", "options": [], "answer": "WELL anneal > Source/Drain anneal > LDD anneal", "note": null}, {"id": 18, "section": "Advanced Packaging", "type": "short", "question": "What’s SEMICONDUCTOR Process / Supply Chain Flow for COWOS (Chip-On-Wafer-On-Substrate) ? Give some tier-1 company examples for etch step?", "options": [], "answer": null, "note": "原始投影片未標示答案"}, {"id": 19, "section": "Advanced Packaging", "type": "short", "question": "What’s COWOS → COPOS? What’s popular sizes for Wafer & Panel?", "options": [], "answer": null, "note": "原始投影片未標示答案"}, {"id": 20, "section": "Advanced Packaging", "type": "short", "question": "What’s the key device applications on COWOS platform?", "options": [], "answer": null, "note": "原始投影片未標示答案"}, {"id": 21, "section": "Advanced Packaging", "type": "short", "question": "What’s SEMICONDUCTOR 6 key “Process modules” to form a Packaging devices?", "options": [], "answer": null, "note": "原始投影片未標示答案"}, {"id": 22, "section": "Advanced Packaging", "type": "short", "question": "What’s the meaning / stand for TEMP$?", "options": [], "answer": null, "note": "原始投影片未標示答案"}, {"id": 23, "section": "Advanced Packaging", "type": "short", "question": "What’s Packaging Migration Roadmap?", "options": [], "answer": null, "note": "原始投影片未標示答案"}, {"id": 24, "section": "Ion Implantation", "type": "short", "question": "How many kinds of implanter?", "options": [], "answer": "High current implanter (HCI)\nMedium current implanter (MCI)\nHigh energy implanter (HEI)", "note": null}, {"id": 25, "section": "Ion Implantation", "type": "short", "question": "What are three most important parameters of ion implantation?", "options": [], "answer": "Species mass (AMU)\nEnergy (E)\nDose (D)", "note": null}, {"id": 26, "section": "Ion Implantation", "type": "short", "question": "What factors will affect penetration depth of Ion Implantation (list 3 factors)?", "options": [], "answer": "ion mass, ion energy, implant angle, ion channeling", "note": null}, {"id": 27, "section": "Ion Implantation", "type": "short", "question": "List >5 configuration of implanter structure", "options": [], "answer": "(1) Ion source\n(2) Extraction\n(3) Magnet\n(4) Quadrupole (Focus)\n(5) Acceleration/ Deceleration\n(6) Scan\n(7) PFG\n(8) Faraday", "note": null}, {"id": 28, "section": "Ion Implantation", "type": "short", "question": "What major factors in ion source to generate and maintain the plasma?", "options": [], "answer": "(1) Filament current\n(2) Bias current/ voltage\n(3) Arc voltage\n(4) Source magnet\n(5) Dopant gas", "note": null}, {"id": 29, "section": "Ion Implantation", "type": "short", "question": "List 5 implant layers that can make a device?", "options": [], "answer": "Well implant\nAnti-Punch-Thru (APT) / Retrograde well imp\nVt implant\nPoly implant\nSDE/ LDD implant\nS/D implant\nCo implants (C, N, F, Ge)\nContact implant\nPre-silicide implant (PSI) or Pre-amorphous implant (PAI)\nPunch-Thru Stop implant (PTS)", "note": null}, {"id": 30, "section": "Ion Implantation", "type": "short", "question": "What species/ ions used for co implants to tune device performance (list >3 species)?", "options": [], "answer": "C, N, F, Ge, Si, Xe, In, Al", "note": null}, {"id": 31, "section": "Ion Implantation", "type": "short", "question": "What co-implant ions are used to tune ultra-shallow junction (USJ)?", "options": [], "answer": "Ge, C, F", "note": null}, {"id": 32, "section": "Ion Implantation", "type": "short", "question": "What is the function of Cold implant and Hot implant", "options": [], "answer": "Cold implant to make fully amorphous layer\nHot implant to maintain crystal quality", "note": null}, {"id": 33, "section": "Ion Implantation", "type": "short", "question": "What kind of material modification (list 2) can be made by ion implantation?", "options": [], "answer": "Etch rate and stress/ strain tuning/ CMP polish rate", "note": null}, {"id": 34, "section": "PVD Process", "type": "short", "question": "Please describe 3 characters of PVD process ?", "options": [], "answer": "a) High purity\nb) Low temp\nc) Line of sight deposition", "note": null}, {"id": 35, "section": "PVD Process", "type": "short", "question": "Please describe the purposes of Degas and Pre-clean for PVD process ?", "options": [], "answer": "a) Degas is for moisture (H2O) removal and temperature control prior to process in PVD step\nb) Pre-clean is to remove native oxide or oxidized metal for reliable resistivity control.", "note": null}, {"id": 36, "section": "PVD Process", "type": "short", "question": "What are the key components for a PVD chamber ?", "options": [], "answer": "a) Magnet\nb) Pedestal\nc) Target\nd) Process kits.", "note": null}, {"id": 37, "section": "PVD Process", "type": "short", "question": "Please list down 5 indexes which use for PVD process performance evaluation.", "options": [], "answer": "a) Step-coverage\nb) Overhang\nc) Stress\nd) Thickness / Rs uniformity\ne) Target lifetime", "note": null}, {"id": 38, "section": "PVD Process", "type": "short", "question": "Before we can control Ion direction, what should we do first and how ?", "options": [], "answer": "Increase ion density\na) Higher DC power\nb) Stronger magnetic field\nc) Higher RF frequency\nd) Higher pressure", "note": null}, {"id": 39, "section": "ALD Process", "type": "short", "question": "Please describe 3 key driving forces to adopt ALD process", "options": [], "answer": "a) Higher aspect ratio\nb) Excellent Step-coverage required\nc) Very thin film", "note": null}, {"id": 40, "section": "Semiconductor Equipment", "type": "single", "question": "64 bits microprocessor 需要用到幾個 transistor 在 IC Chip 中？", "options": ["8 個 transistors", "16 個 transistors", "32 個 transistors", "64 個 transistors", "128 個 transistors"], "answer": [3], "note": "依投影片標示；64-bit 處理器不代表只有 64 個電晶體"}, {"id": 41, "section": "Semiconductor Equipment", "type": "single", "question": "為了提高燈泡對於 Wafer 的加熱效果，EPI Chamber 加裝了反射板，其表面材質是甚麼？", "options": ["Silver (銀)", "Aluminum (鋁)", "Titanium (鈦)", "Gold (黃金)", "Silicon (矽)"], "answer": [3], "note": null}, {"id": 42, "section": "Semiconductor Equipment", "type": "single", "question": "在 PVD 製程設備中，是使用哪一種製程平台，安裝 PVD 製程反應室？", "options": ["Producer GT Platform", "Centris Y15 Platform", "Endura 2 Platform", "Producer XP Platform", "Centura Platform"], "answer": [2], "note": null}, {"id": 43, "section": "Semiconductor Equipment", "type": "single", "question": "可以安裝 Twin chamber 的 CVD 設備平台，其名稱為？", "options": ["Centura platform", "Endura platform", "Producer platform", "Centris platform", "P5000 platform"], "answer": [2], "note": null}, {"id": 44, "section": "Semiconductor Equipment", "type": "single", "question": "本課介紹的 Olympia ALD-CVD 製程反應室，一次製程最多可以搭載多少片 Wafer？", "options": ["1 片 Wafer", "2 片 Wafers", "4 片 Wafers", "6 片 Wafers", "12 片 Wafers"], "answer": [3], "note": null}, {"id": 45, "section": "Semiconductor Equipment", "type": "single", "question": "True/False，在本課程介紹的 Reflexion LK CMP 設備，Wafer 是乾進濕出？", "options": ["True", "False"], "answer": [1], "note": null}, {"id": 46, "section": "Semiconductor Equipment", "type": "single", "question": "在 ETCH 反應室中，將製程衍生物帶走的真空 pump，其名稱為？", "options": ["Tur const STORAGE='semiconductor_quiz_94_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE))||{}}catch(e){}
const state={mode:'all',topic:'all',search:'',index:0,shuffle:false,order:questions.map(q=>q.id),selected:{},shown:{},shortInputs:{}};
const el=id=>document.getElementById(id);
function store(){try{localStorage.setItem(STORAGE,JSON.stringify(saved))}catch(e){}}
function labels(q){return q.type==='single'&&q.id<=49?'ABCDE'.split(''):q.type==='single'&&q.id===79?'ABCDE'.split(''):q.type==='single'&&q.id>=77?'abcd'.split(''):q.type==='multi'&&q.id>=93?'abcd'.split(''):q.type==='multi'&&q.id<=84?'ABCDE'.split(''):'123456'.split('')}
function isReference(q){return q.note?.includes('參考答案')||q.note?.includes('未標示')}
function filtered(){let rows=questions.filter(q=>(state.mode==='all'||state.mode===q.type||state.mode==='wrong'&&saved[q.id]?.status==='wrong'||state.mode==='review'&&saved[q.id])&&(state.topic==='all'||q.section===state.topic)&&(!state.search||String(q.id)===state.search||q.question.toLowerCase().includes(state.search)||q.options.some(s=>s.toLowerCase().includes(state.search))));return rows.sort((a,b)=>state.order.indexOf(a.id)-state.order.indexOf(b.id))}
function escapeHtml(t){return String(t??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function selectMode(mode){state.mode=mode;state.index=0;state.selected={};state.shown={};render()}
function choice(q,i){const arr=state.selected[q.id]||[];state.selected[q.id]=q.type==='multi'?(arr.includes(i)?arr.filter(j=>j!==i):[...arr,i]):[i];if(el('autoReveal').checked)grade(q,true);else render()}
function grade(q,auto=false){if(q.type==='short'){state.shown[q.id]=true;render();return}const sel=state.selected[q.id]||[];if(!sel.length&&!auto)return;state.shown[q.id]=true;if(q.answer){const ok=sel.length===q.answer.length&&sel.every(i=>q.answer.includes(i));saved[q.id]={status:ok?'correct':'wrong',selected:sel};store()}else{saved[q.id]={status:'ungraded',selected:sel};store()}render()}
function markShort(q,good){saved[q.id]={status:good?'correct':'wrong',text:state.shortInputs[q.id]||''};store();render()}
function reset(){if(confirm('確定要清除全部練習紀錄？此操作無法復原。')){saved={};store();render()}}
function renderSide(){let modes=[['all','全部題目',94],['short','簡答題',39],['single','單選題',40],['multi','多選題',15],['wrong','錯題複習',Object.values(saved).filter(v=>v.status==='wrong').length],['review','已做題目',Object.keys(saved).length]];el('sidebar').innerHTML='<h3>練習模式</h3>'+modes.map(([key,name,n])=>`<button class="${state.mode===key?'active':''}" data-mode="${key}"><span>${name}</span><span>${n}</span></button>`).join('')+'<h3>學習工具</h3><button id="allAns"><span>📖 答案速覽</span><span>↗</span></button><button id="reset"><span>↺ 清除進度</span><span></span></button>';el('sidebar').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));el('reset').onclick=reset;el('allAns').onclick=showAllAnswers}
function showAllAnswers(){let list=filtered();el('content').innerHTML='<div class="q-top"><b>答案速覽</b><button class="btn" id="closeAnswers">返回練習</button></div>'+list.map(q=>`<div style="padding:13px 0;border-bottom:1px solid #e9ecf3"><b style="color:#4e5cde">#${q.id}</b> ${escapeHtml(q.question)}<p style="color:#148461;white-space:pre-line;margin-bottom:0">${escapeHtml(answerText(q))}</p></div>`).join('');el('closeAnswers').onclick=render;el('where').textContent=`共 ${list.length} 題｜答案速覽`}
function answerText(q){if(!q.answer)return '原始投影片未標示答案';if(q.type==='short')return q.answer;return q.answer.map(i=>`${labels(q)[i]}. ${q.options[i]}`).join(' / ')}
function render(){renderSide();let rows=filtered();let attempted=Object.keys(saved).length,correct=Object.values(saved).filter(v=>v.status==='correct').length,wrong=Object.values(saved).filter(v=>v.status==='wrong').length;el('attempted').textContent=attempted;el('correct').textContent=correct;el('wrong').textContent=wrong;el('progress').style.width=(attempted/questions.length*100)+'%';state.index=Math.min(state.index,Math.max(0,rows.length-1));if(!rows.length){el('where').textContent='沒有符合條件的題目';el('content').innerHTML='<div class="empty"><h2>這裡目前沒有題目</h2><p>試著清除搜尋，或切換其他題型分類。</p><button class="btn primary" id="clear">查看全部題目</button></div>';el('clear').onclick=()=>{state.search='';state.topic='all';el('search').value='';el('topic').value='all';selectMode('all')};return}const q=rows[state.index],sel=state.selected[q.id]??saved[q.id]?.selected??[],shown=!!state.shown[q.id]||el('showAnswer').checked,record=saved[q.id];el('where').textContent=`第 ${state.index+1} / ${rows.length} 題 · 題庫編號 #${q.id}`;
let markup=`<div class="q-top"><div><span class="pill">${escapeHtml(q.section)}</span> <span class="pill">${q.type==='short'?'簡答題':q.type==='single'?'單選題':'多選題'}</span></div><span class="num">Q ${String(q.id).padStart(2,'0')} / 94</span></div><h2 class="question">${escapeHtml(q.question)}</h2>`;
if(q.type==='short')markup+=`<textarea id="shortInput" placeholder="先試著寫下你的答案，再點擊「顯示答案」…">${escapeHtml(state.shortInputs[q.id]??saved[q.id]?.text??'')}</textarea>`;
else markup+=`<div class="opts">${q.options.map((op,i)=>{let chosen=sel.includes(i),correct=shown&&q.answer?.includes(i),wrong=shown&&chosen&&!q.answer?.includes(i);return `<button class="option ${correct?'correct':wrong?'wrong':chosen?'selected':''}" data-choice="${i}" ${shown?'disabled':''}><span class="mark">${labels(q)[i]||i+1}</span><span>${escapeHtml(op)}</span></button>`}).join('')}</div>`;
if(shown)markup+=`<div class="answer"><strong>${q.answer?'標準答案':'原始投影片未提供答案'}</strong>${isReference(q)?'<span style="color:#a76b20;font-size:12px"> · '+escapeHtml(q.note)+'</span>':''}<div style="margin-top:9px">${escapeHtml(answerText(q))}</div></div>`;
if(record&&record.status!=='ungraded')markup+=`<div class="feedback ${record.status==='correct'?'good':'bad'}">${record.status==='correct'?'✓ 已答對':'✕ 已標記為錯題'}</div>`;
markup+=`<div class="actions">${q.type==='short'?shown?'<button class="btn" id="markBad">還不熟悉</button><button class="btn primary" id="markGood">我答對了</button>':'<button class="btn primary" id="reveal">顯示答案</button>':shown?'<button class="btn soft" id="redo">重新作答</button>':'<button class="btn primary" id="submit">確認答案</button>'}<button class="btn push" id="prev" ${state.index===0?'disabled':''}>← 上一題</button><button class="btn primary" id="next" ${state.index===rows.length-1?'disabled':''}>下一題 →</button></div>`;
el('content').innerHTML=markup;
el('content').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choice(q,+b.dataset.choice));if(el('shortInput'))el('shortInput').oninput=e=>state.shortInputs[q.id]=e.target.value;
if(el('submit'))el('submit').onclick=()=>grade(q);if(el('reveal'))el('reveal').onclick=()=>grade(q);if(el('redo'))el('redo').onclick=()=>{state.selected[q.id]=[];state.shown[q.id]=false;render()};if(el('markGood'))el('markGood').onclick=()=>markShort(q,true);if(el('markBad'))el('markBad').onclick=()=>markShort(q,false);el('prev').onclick=()=>{state.index--;render()};el('next').onclick=()=>{state.index++;render()};
}
const topics=[...new Set(questions.map(q=>q.section))];topics.forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;el('topic').append(o)});el('topic').onchange=e=>{state.topic=e.target.value;state.index=0;render()};el('search').oninput=e=>{state.search=e.target.value.trim().toLowerCase();state.index=0;render()};el('shuffle').onclick=()=>{state.shuffle=!state.shuffle;state.order=questions.map(q=>q.id);if(state.shuffle){for(let i=state.order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[state.order[i],state.order[j]]=[state.order[j],state.order[i]]}}el('shuffle').textContent=state.shuffle?'恢復原順序':'隨機排序';state.index=0;render()};el('showAnswer').onchange=render;el('autoReveal').onchange=()=>{};document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))return;let rows=filtered();if(e.key==='ArrowRight'&&state.index<rows.length-1){state.index++;render()}if(e.key==='ArrowLeft'&&state.index>0){state.index--;render()}});render();
